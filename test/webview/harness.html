<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>json viewer harness</title>
  <style>
    :root {
      --vscode-editor-foreground: #cccccc; --vscode-editor-background: #1e1e1e;
      --vscode-editor-font-family: Consolas, monospace; --vscode-editor-font-size: 14px; --vscode-font-family: "Segoe UI", sans-serif; --vscode-icon-foreground: #c5c5c5;
      --vscode-panel-border: #3f3f46; --vscode-widget-border: #454545;
      --vscode-editorWidget-background: #252526; --vscode-input-foreground: #cccccc;
      --vscode-input-background: #313131; --vscode-focusBorder: #007fd4;
      --vscode-descriptionForeground: #9d9d9d; --vscode-button-secondaryForeground: #fff;
      --vscode-button-secondaryBackground: #3a3d41; --vscode-button-secondaryHoverBackground: #45494e;
      --vscode-toolbar-hoverBackground: #2a2d2e; --vscode-symbolIcon-propertyForeground: #9cdcfe;
      --vscode-debugTokenExpression-string: #ce9178; --vscode-debugTokenExpression-number: #b5cea8;
      --vscode-debugTokenExpression-boolean: #569cd6; --vscode-editor-findMatchHighlightBackground: #515c6a;
      --viewer-font-size: var(--vscode-editor-font-size); --viewer-line-height: calc(var(--vscode-editor-font-size) * 1.5); --viewer-indent: 18px; --viewer-padding: 0px; --viewer-line-number-width: 44px; --viewer-fold-gutter: 24px; --viewer-gutter: calc(var(--viewer-line-number-width) + var(--viewer-fold-gutter));
      --bracket-0: #ffd700; --bracket-1: #da70d6; --bracket-2: #179fff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; color: var(--vscode-editor-foreground); background: var(--vscode-editor-background); font-family: var(--vscode-editor-font-family); font-size: var(--viewer-font-size); }
    button, input { font: inherit; }
    button { color: var(--vscode-icon-foreground, var(--vscode-editor-foreground)); border: 0; cursor: pointer; }
    #content { height: 100%; padding: 18px 0 48px; overflow: auto; }
    #tree { min-width: max-content; width: 100%; }
    .node { min-width: max-content; }
    .root-page, .children-page { display: contents; }
    .row, .closing { position: relative; display: flex; min-width: max-content; min-height: var(--viewer-line-height); padding: 0 28px 0 calc(var(--viewer-padding) + var(--viewer-gutter) + var(--depth) * var(--viewer-indent)); line-height: var(--viewer-line-height); }
    .row.match { background: var(--vscode-editor-findMatchHighlightBackground); }
    .line { position: absolute; left: var(--viewer-padding); width: var(--viewer-line-number-width); padding-right: 8px; color: #858585; text-align: right; user-select: none; }
    .toggle { position: relative; flex: 0 0 var(--viewer-line-height); width: var(--viewer-line-height); height: var(--viewer-line-height); min-height: var(--viewer-line-height); margin-left: calc(-1 * var(--viewer-line-height)); padding: 0; background: transparent; }
    .toggle::before { content: ''; position: absolute; left: calc(50% - 3px); top: calc(50% - 4px); border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 6px solid currentColor; }
    .toggle.expanded::before { transform: rotate(90deg); }
    .toggle.empty { visibility: hidden; }
    .key, .value, .preview { display: inline-block; margin: 0 -3px; padding: 0 3px; border-radius: 4px; cursor: pointer; white-space: pre; }
    .key:hover, .value:hover, .preview:hover { background: var(--vscode-toolbar-hoverBackground); }
    .key { color: var(--vscode-symbolIcon-propertyForeground); font-weight: 600; }
    .string { color: var(--vscode-debugTokenExpression-string); font-weight: 600; }
    .number { color: var(--vscode-debugTokenExpression-number); }
    .boolean, .null { color: var(--vscode-debugTokenExpression-boolean); font-weight: 600; }
    .preview { color: var(--vscode-descriptionForeground); }
    .bracket { font-weight: 600; }
    .bracket.depth-0 { color: var(--bracket-0); }
    .bracket.depth-1 { color: var(--bracket-1); }
    .bracket.depth-2 { color: var(--bracket-2); }
    .children[hidden], .closing[hidden], #load-more[hidden], .search-panel[hidden] { display: none; }
    .children-page { display: contents; }
    .children-more, #load-more { min-height: 26px; padding: 2px 10px; color: var(--vscode-button-secondaryForeground); background: var(--vscode-button-secondaryBackground); border-radius: 3px; }
    .children-more { margin: 4px 0 4px calc(var(--viewer-padding) + 18px); }
    #load-more { margin: 10px 0 0 var(--viewer-padding); }
    .toolbar { position: fixed; z-index: 20; top: 8px; right: 10px; display: flex; gap: 2px; padding: 3px; border: 1px solid var(--vscode-widget-border); border-radius: 5px; background: var(--vscode-editorWidget-background); }
    .icon-button { position: relative; width: 26px; height: 26px; min-height: 26px; padding: 0; background: transparent; }
    .expand-all::before, .collapse-all::before { content: ''; position: absolute; left: 6px; top: 6px; width: 12px; height: 12px; border: 1px solid currentColor; }
    .expand-all::after, .collapse-all::after { content: ''; position: absolute; left: 9px; top: 12px; width: 8px; height: 1px; background: currentColor; }
    .expand-all::before { background: linear-gradient(currentColor,currentColor) center/1px 8px no-repeat; }
    .refresh::before { content: ''; position: absolute; left: 6px; top: 6px; width: 11px; height: 11px; border: 1.5px solid currentColor; border-right-color: transparent; border-radius: 50%; }
    .search-panel { position: fixed; z-index: 30; top: 8px; right: 10px; display: grid; grid-template-columns: minmax(180px,320px) 44px 26px 26px 26px; align-items: center; gap: 2px; padding: 4px; border: 1px solid var(--vscode-widget-border); border-radius: 5px; background: var(--vscode-editorWidget-background); }
    #search { height: 26px; color: var(--vscode-input-foreground); background: var(--vscode-input-background); border: 1px solid transparent; }
    #search-count { text-align: center; color: var(--vscode-descriptionForeground); }
    @media (max-width: 520px) { :root { --viewer-indent: 16px; } .search-panel { left: 8px; right: 8px; grid-template-columns: minmax(100px,1fr) 38px 26px 26px 26px; } }
  </style>
</head>
<body>
  <div id="search-panel" class="search-panel" hidden>
    <input id="search" type="search" placeholder="Search keys and values">
    <span id="search-count"></span>
    <button id="search-previous" class="icon-button"></button>
    <button id="search-next" class="icon-button"></button>
    <button id="search-close" class="icon-button"></button>
  </div>
  <div class="toolbar">
    <button id="expand-all" class="icon-button expand-all" title="Expand all"></button>
    <button id="collapse-all" class="icon-button collapse-all" title="Collapse all"></button>
    <button id="refresh" class="icon-button refresh" title="Refresh"></button>
  </div>
  <main id="content"><div id="tree" role="tree"></div><button id="load-more" hidden>Load more</button></main>
  <div id="status"></div>
  <script>
    const nodes = {
      '$': [{ id: '$/sample_id#0', type: 'string', key: 'sample_id', value: '13eb2c6a', line: 2, endLine: 2, childCount: 0, trailingComma: true }, { id: '$/correct#0', type: 'boolean', key: 'correct', value: true, line: 3, endLine: 3, childCount: 0, trailingComma: true }, { id: '$/scores#0', type: 'object', key: 'scores', preview: '{2}', line: 4, endLine: 7, childCount: 2 }],
      '$/scores#0': [{ id: '$/scores#0/A#0', type: 'object', key: 'A', preview: '{1}', line: 5, endLine: 5, childCount: 1, trailingComma: true }, { id: '$/scores#0/B#0', type: 'number', key: 'B', value: '-0.01', line: 6, endLine: 6, childCount: 0 }],
      '$/scores#0/A#0': [{ id: '$/scores#0/A#0/deep#0', type: 'object', key: 'deep', preview: '{1}', line: 5, endLine: 5, childCount: 1 }],
      '$/scores#0/A#0/deep#0': [{ id: '$/scores#0/A#0/deep#0/value#0', type: 'number', key: 'value', value: '1', line: 5, endLine: 5, childCount: 0 }]
    };
    window.acquireVsCodeApi = () => ({
      getState: () => undefined, setState: () => {},
      postMessage: (message) => {
        if (message.type === 'ready' || message.type === 'refresh') { dispatch({ type: 'settings', fontSize: 13 }); dispatch({ type: 'document', payload: { kind: 'json', total: 1 } }); }
        if (message.type === 'requestChunk') dispatch({ type: 'chunkData', requestId: message.requestId, start: 0, nodes: [{ id: '$', type: 'object', preview: '{3}', line: 1, endLine: 8, childCount: 3, defaultExpanded: true }], done: true });
        if (message.type === 'requestChildren') dispatch({ type: 'childrenData', requestId: message.requestId, nodeId: message.nodeId, start: message.start, nodes: nodes[message.nodeId] || [], done: true });
        if (message.type === 'findMatches') dispatch({ type: 'searchResults', requestId: message.requestId, matches: message.query ? [{ nodeId: '$/scores#0/B#0', pathIds: ['$', '$/scores#0', '$/scores#0/B#0'], pathIndexes: [0,2,1], rootIndex: 0 }] : [] });
      }
    });
    function dispatch(data) { setTimeout(() => window.dispatchEvent(new MessageEvent('message', { data })), 0); }
  </script>
  <script src="../../dist/webview.js"></script>
</body>
</html>
